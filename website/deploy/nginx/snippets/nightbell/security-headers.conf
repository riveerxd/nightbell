# Response headers sent on every reply.
#
# ## Read this before editing, because Nginx will silently drop the lot
#
# `add_header` does not accumulate down the tree. A location block containing a
# single `add_header` of its own discards every `add_header` inherited from its
# parent, without a warning, and the page still works. That is why this file
# exists as an include and why it is included in the server block AND in every
# location that sets a Cache-Control header of its own. Add a location that sets
# a header without including this file and that location serves with no CSP.
#
# `always` makes these apply to error responses too. Without it the 404 goes out
# bare, and the 404 is a page an attacker can reach on purpose.
#
# ## The Content-Security-Policy, line by line
#
# default-src 'self'      Nothing loads from anywhere but this origin. There is
#                         no CDN, no analytics, no font service and no embed.
# script-src 'self'       One external module, /_astro/*.js, the video player.
#                         No 'unsafe-inline' and no hashes needed: the build
#                         emits zero inline handlers and zero inline scripts.
#                         The four <script type="application/ld+json"> blocks are
#                         data rather than code, are never executed, and so are
#                         not subject to script-src in any browser.
# style-src ... 'unsafe-inline'
#                         The honest weak point. Astro is configured with
#                         inlineStylesheets 'always', so the whole stylesheet
#                         arrives in a <style> block, and the page carries 121
#                         style="..." attributes. A hash covers the <style> block
#                         but attributes need 'unsafe-hashes' plus one hash each,
#                         and 121 hashes in a header is not a security control,
#                         it is a liability with a version number. What this
#                         costs is real but narrow: CSS injection stays possible
#                         if markup injection is ever possible, and on a site
#                         built from static files with no user input and no query
#                         parameters, markup injection has no route in.
# img-src 'self'          No data: URI is emitted anywhere in the build, checked
#                         against dist/ rather than assumed.
# connect-src 'self'      The page itself makes no fetch, no XHR and no WebSocket,
#                         so 'none' was correct and is what this said first. It was
#                         relaxed to 'self' for one measurable reason: auditors read
#                         robots.txt with a fetch() from the page, and 'none' blocks
#                         that, so every Lighthouse run reported "unable to download
#                         a robots.txt file" and docked the SEO score by eight
#                         points for a file that is served correctly. Real crawlers
#                         request robots.txt directly and were never affected, but a
#                         permanent false failure in the one report anyone runs is
#                         its own kind of cost.
#
#                         What the relaxation gives up is small and worth naming:
#                         'self' would let an injected script read same-origin URLs.
#                         What it keeps is the part that matters, which is that
#                         nothing can be sent anywhere else. Exfiltration to a third
#                         party is still refused, because no other origin is
#                         allowed.
# frame-ancestors 'none'  Nothing may frame this page. Pairs with X-Frame-Options
#                         for anything too old to read CSP.
# form-action 'none'      There is no form. Saying so stops an injected one from
#                         posting anywhere.
# base-uri 'none'         Stops an injected <base> from re-pointing every
#                         relative URL on the page.
#
# report-uri is deliberately absent. It needs an endpoint that collects reports,
# this site has no backend, and a policy that reports to nowhere reads like
# monitoring while being none.

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; media-src 'self'; font-src 'self'; connect-src 'self'; manifest-src 'self'; object-src 'none'; frame-src 'none'; worker-src 'none'; frame-ancestors 'none'; form-action 'none'; base-uri 'none'" always;

# Two years, subdomains included, and preload asserted.
#
# .app is on the HSTS preload list at the TLD level, so every browser already
# refuses plaintext to this origin whether or not this header is sent. It is sent
# anyway because it is what makes the assertion true rather than incidental, and
# because a future apex on a TLD without that property inherits a correct header
# instead of a missing one.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

# Serve the declared Content-Type or nothing. Stops a .txt being run as script
# because a browser guessed at its contents.
add_header X-Content-Type-Options "nosniff" always;

# Superseded by frame-ancestors above, kept for clients that predate CSP.
add_header X-Frame-Options "DENY" always;

# Send the full URL within this origin, the origin only when crossing to HTTPS,
# and nothing at all when downgrading. The outbound links here all go to GitHub,
# which has no business knowing which anchor somebody clicked from.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Every capability this page could ask for and does not want. A static landing
# page needs none of them, so the answer is the same for all of them.
add_header Permissions-Policy "accelerometer=(), ambient-light-sensor=(), autoplay=(), battery=(), camera=(), display-capture=(), document-domain=(), encrypted-media=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), usb=(), xr-spatial-tracking=()" always;

# Severs the window.opener relationship for anything this page opens or is opened
# by. Cheap, and the page opens eleven external links.
add_header Cross-Origin-Opener-Policy "same-origin" always;

# Cross-Origin-Resource-Policy is deliberately not set. same-origin would be
# correct for everything the page loads itself, and it is also the header that
# stops other origins embedding /media/nightbell-og.jpg, which is exactly what an
# Open Graph card is for. The protection it offers a site with no credentialed
# endpoints is close to nil, so the unfurl wins.
