# Restore the visitor's address from Cloudflare's CF-Connecting-IP header.
#
# With the orange cloud on, every connection to this origin comes from a
# Cloudflare edge node, so $remote_addr is a Cloudflare address on every request.
# Left alone, that makes the access log a list of Cloudflare POPs, and it makes
# any rate limit or allow rule apply to the edge rather than to a visitor.
#
# `set_real_ip_from` is the trust list. It has to be exactly Cloudflare's ranges
# and nothing else: any address in here can set its own apparent address by
# sending the header, so an over-broad entry hands out address spoofing.
#
# `real_ip_recursive` stays off. CF-Connecting-IP carries a single address rather
# than a chain, so there is nothing to walk, and recursion only matters for
# X-Forwarded-For.
#
# Generated by deploy/scripts/cloudflare-ips.sh. Do not edit by hand.
#
# Snapshot taken 2026-08-10. 15 IPv4 ranges, 7 IPv6.

set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header CF-Connecting-IP;
real_ip_recursive off;
