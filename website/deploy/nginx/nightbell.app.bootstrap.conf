# Bootstrap vhost. Port 80 only. Temporary, replaced by nightbell.app.conf.
#
# This exists to solve one ordering problem: the real config needs a certificate,
# and getting a certificate needs a server that can answer the ACME challenge.
# It is installed first, the certificate is issued against it, and then it is
# replaced.
#
# Two deliberate properties, both about not breaking anything:
#
# 1. **It never redirects.** A 301 to HTTPS here would be a hard outage if the zone
#    is on Cloudflare's Flexible SSL mode, because Flexible fetches the origin over
#    plaintext, would receive that redirect, fetch again, and loop. Serving the site
#    over plain HTTP is correct under every SSL mode, so this cannot loop under any
#    of them. The real config adds the redirect once the mode is known.
#
# 2. **It claims port 80 only.** Under Full and Full (strict), Cloudflare fetches
#    the origin over HTTPS, so this block is not in the path of ordinary traffic at
#    all and the domain keeps serving whatever it served before. That makes
#    installing this a no-op for visitors and a yes-op for Let's Encrypt.
#
# Which of those is true is also what this file measures: enable it, then request
# the site through Cloudflare. If the Nightbell page appears, the zone is Flexible.
# If the previous site still appears, it is Full or Full (strict).

server {
    listen 80;
    listen [::]:80;
    server_name nightbell.app www.nightbell.app;

    # Served from its own directory rather than the site root, so a release swap
    # cannot remove a challenge file while it is being validated.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/nightbell.app/acme;
        default_type "text/plain";
        try_files $uri =404;
    }

    root /var/www/nightbell.app/current;
    index index.html;

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
