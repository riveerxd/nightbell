# nightbell.app, static, behind Cloudflare's proxy.
#
#   install to  /etc/nginx/sites-available/nightbell.app.conf
#   symlink at  /etc/nginx/sites-enabled/nightbell.app.conf
#   snippets    /etc/nginx/snippets/nightbell/
#   root        /var/www/nightbell.app/current   (a symlink, see deploy.sh)
#
# Written against the box this actually runs on, which is not a spare VPS: it is a
# shared origin serving fourteen other sites, several of them somebody's business.
# Three things follow from that and are worth reading before editing:
#
# 1. There is no `default_server` block here. The box has none across all fourteen
#    sites, so nginx currently falls back to whichever server block loads first,
#    which is anketa.conf. Adding a default here would change the fallback for
#    every other domain pointed at this address, which is not this site's decision
#    to make. The cost is that an unmatched Host still reaches anketa, exactly as
#    it did before. See "The fallback" at the bottom.
#
# 2. nginx is 1.18.0. `ssl_reject_handshake` (1.19.4+) and `http2 on` (1.25.1+) are
#    both unavailable, so neither appears.
#
# 3. `listen 443 ssl` carries no `http2`. Nine of the existing blocks spell it that
#    way and four add http2, so the box tolerates either, but Cloudflare speaks
#    HTTP/1.1 to origins, which makes origin HTTP/2 unreachable in practice. Not
#    worth a duplicate-listen-options risk on a shared socket for a setting nothing
#    will negotiate.
#
# Always `nginx -t` before reloading. A syntax error here takes down all fifteen
# sites together, not just this one.

# ---------------------------------------------------------------------------
# The download log, and what it deliberately does not record.
#
# One line per click on /download. This is the entire analytics stack for this
# site: no JavaScript, no third party, no cookie, no consent banner, and no change
# to the Content-Security-Policy, which says there is no analytics here and stays
# true because nothing was added to the page.
#
# `log_format` is only valid in the http context, which is where sites-enabled is
# included from, so this sits outside the server blocks below. The name is
# prefixed because the fourteen other sites on this box share that namespace and a
# duplicate name is a config error that takes all of them down.
#
# ## The fields, and the four that are missing
#
# $time_iso8601         When. Sortable as a string, which is what makes the date
#                       filtering in downloads.sh a string comparison.
# $status               Always 302 in practice. Logged anyway, because if this
#                       ever starts saying something else the count is wrong and
#                       this is the field that says so.
# $http_cf_ipcountry    Two-letter country, set by Cloudflare on the way in. Free
#                       geography with nothing stored about a person.
# $http_referer         Where the click came from. The one field that answers "did
#                       that Reddit thread do anything", which is the actual
#                       question. It is this site's own URL for a click on the
#                       page, empty for a direct hit or a pasted link.
# $http_user_agent      Kept only to subtract the crawlers, which are otherwise a
#                       large and invisible fraction of the total.
#
# No $remote_addr, and this is a choice rather than an oversight. The real client
# IP is available here (cloudflare-real-ip.conf restores it, so this would log the
# visitor and not the edge), and logging it would allow deduplicating clicks per
# person, which is the one thing this format cannot do. It is not logged because
# an IP is personal data under GDPR, storing it starts a retention obligation and
# puts a lawful-basis question on a site that currently has neither, and the
# question being answered is "how many, from where, from which link", none of which
# needs it. The cost is real and worth stating plainly: every number this produces
# is clicks, never visitors, and one enthusiastic person with a flaky connection
# looks exactly like five people.
#
# No $request either, because there is exactly one path that writes to this file.
log_format nightbell_download '$time_iso8601 $status $http_cf_ipcountry "$http_referer" "$http_user_agent"';

# ---------------------------------------------------------------------------
# The census log, and the four fields it refuses.
#
# One line per app checking which version is current. Every install with update
# checks on does that four times a day, so this file answers the question this
# project could not answer at all: how many copies of Nightbell are running.
#
# ## How a count works with nothing to count by
#
# By counting requests and dividing, not by recognising devices. The check
# interval is six hours and it is set in the app's own source
# (`AppUpdate.CHECK_INTERVAL_MS`), so requests per day over the per install rate
# is the number of live installs. The rate is under four, because a phone in Doze
# defers the worker and a phone in a tunnel is not checking anything, so it gets
# measured against a release day rather than assumed. See deploy/scripts/census.sh.
#
# The absolute number carries real error, maybe a quarter. The trend does not, and
# the trend is the thing worth having. Alongside it there is one exact number:
# an install's first ever check appends `new` to its User-Agent and no later check
# does, so counting that word is counting installs, precisely, with no identifier
# involved anywhere.
#
# ## The fields
#
# $time_iso8601         When, to the second. Sortable as a string, which is what
#                       makes the date filtering in census.sh a string comparison.
# $status               200 in practice, and worth logging for a 5xx or a 304
#                       that should not be there.
#
#                       It will not report a missing manifest, which is what this
#                       field was originally put here to catch, and the reason is
#                       worth knowing before relying on it: `error_page 404
#                       /404.html` below turns a miss into an internal redirect,
#                       and nginx logs a request in the access_log of the location
#                       it finishes in. So a deploy without the manifest writes a
#                       404 line into the site's ordinary access log and nothing at
#                       all into this file. The detector for that case is
#                       `npm run validate`, which fails the build when
#                       dist/v1/release.json is absent, plus census.sh noticing
#                       that a whole day has no lines in it.
# $http_user_agent      `Nightbell/3.10.0 (Android)`, or the same with `; new` on
#                       an install's first ever check. This is where the version
#                       histogram and the install count both come from, and it is
#                       also how a crawler is told apart from an app.
#
# ## What is missing, and why each one
#
# No $remote_addr. The reasoning is the same as the download log's above and it is
# stronger here: an address in this file could be deduplicated per device, which
# would turn a count into a per person history of when someone's phone was awake.
# That is a different product than the one being built. It is not logged, and no
# hash of it is logged either, because a salted hash on disk is still personal
# data with a retention obligation attached and it buys only retention curves.
#
# No $http_cf_ipcountry. Free geography with nothing stored about a person is a
# fair trade on a click; on a population of devices reporting four times a day it
# is the beginning of a profile, and nobody asked this question.
#
# No $http_referer, because a machine reading a JSON file has none, and no
# $request, because exactly one path writes to this file.
log_format nightbell_census '$time_iso8601 $status "$http_user_agent"';

# ---------------------------------------------------------------------------
# The site log, and the question it exists to answer.
#
# One line per request to a page on this site. The other two logs in this file
# each watch a single path; this one watches everything else, and it was added
# because without it nightbell.app had no access log of its own at all.
#
# ## What that cost
#
# Fifteen sites share this box and all of them write to /var/log/nginx/access.log
# in the distro's combined format, which carries no $host. So a question as basic
# as "has a chatbot's crawler ever read this site" had no answer here. In September 2026
# that log held 5,435 OAI-SearchBot requests and there was no way to tell how many
# were nightbell.app and how many were one of the other fourteen. The two hits
# that could be proven were proven only because they happened to land on /download,
# which has a log of its own.
#
# That matters more now than it would have a month ago. ChatGPT sent real people
# to this site in August and September, six of them with utm_source=chatgpt.com on
# the referrer, and the pages they were sent to are a thing worth knowing.
#
# ## The fields
#
# $time_iso8601         When. Sortable as a string, same as the other two.
# $status               What came back. A crawler getting 404s is the failure this
#                       log is most likely to catch first.
# $http_cf_ipcountry    Two-letter country from Cloudflare.
# $request_uri          Which page, with the query string as sent. Unnormalised on
#                       purpose: a probe like /download?file=../../.azure/credentials
#                       is a thing to be able to see, and $uri would have hidden it.
# $http_referer         Where it came from. This is the field that catches the next
#                       utm_source=chatgpt.com before it is six clicks old.
# $http_user_agent      Which crawler, or which browser.
#
# No $remote_addr, for the reasons written out at length against the download log
# above. The same rule applies here and for the same reasons: this log answers
# what was read and by which program, and none of that needs an address.
#
# The quoted fields are last and in this order because deploy/scripts/bots.sh
# splits each line on the double quote and reads $2, $4 and $6. Changing the order
# changes every number that script prints without making anything look broken.
log_format nightbell_site '$time_iso8601 $status $http_cf_ipcountry "$request_uri" "$http_referer" "$http_user_agent"';

# ---------------------------------------------------------------------------
# Plaintext, and the ACME challenge.
#
# Two jobs. The challenge path is served as files, and everything else is redirected
# to HTTPS.
#
# The ordering matters: the challenge location has to be matched before the
# redirect, or Let's Encrypt follows a 301 to HTTPS and validates against whatever
# certificate is on 443, which during a first issue is not this site's.
#
# IMPORTANT, and the one thing to check before reloading: this redirect is correct
# only if the zone's SSL/TLS mode is Full or Full (strict). Those modes make
# Cloudflare fetch from the origin over HTTPS. On **Flexible**, Cloudflare fetches
# over plaintext, gets this 301, fetches again, and loops until the browser gives
# up, with the site hard down. If the mode is ever moved to Flexible, delete the
# redirect and serve the site from this block instead.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name nightbell.app www.nightbell.app;

    # Served from its own directory rather than from the site root, so a release
    # swap can never remove a challenge file mid-validation.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/nightbell.app/acme;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://nightbell.app$request_uri;
    }
}

# ---------------------------------------------------------------------------
# www, redirected.
#
# The apex is canonical in site.config.mjs, in the canonical link, in the sitemap
# and in three JSON-LD @ids. A www that served the same bytes would be a duplicate
# of the entire site.
#
# The certificate has to cover this name for the redirect to be reachable at all,
# which is why it is issued for both names. www is a proxied CNAME to the apex.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.nightbell.app;

    ssl_certificate     /etc/letsencrypt/live/nightbell.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nightbell.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Sent on the redirect too, so a browser arriving at www learns the HSTS policy
    # now rather than one hop later.
    include snippets/nightbell/security-headers.conf;

    return 301 https://nightbell.app$request_uri;
}

# ---------------------------------------------------------------------------
# The site.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name nightbell.app;

    root /var/www/nightbell.app/current;
    index index.html;

    # Puts `; charset=utf-8` on the Content-Type of every text response.
    #
    # nginx sends bare `text/html` by default, and while the document carries
    # `<meta charset="utf-8">` and browsers honour it, the header is the
    # authoritative declaration and the meta tag is the fallback. SEO auditors flag
    # the missing header specifically, and they are right to: a header costs nothing
    # and removes a guess.
    #
    # `charset` only appends to the types in `charset_types`, which by default is
    # text/html, text/xml, text/plain, text/vnd.wap.wml, application/javascript and
    # application/rss+xml. That covers the documents, robots.txt and the sitemap,
    # and it cannot touch the Content-Type of the mp4s, the WebP images or the
    # woff2 fonts, none of which are in that list.
    charset utf-8;

    # -- The site log --------------------------------------------------------
    #
    # Server level, so it covers every location that does not name a log of its
    # own. That is every page on the site.
    #
    # The three exclusions are deliberate and they are all already covered. The
    # asset locations under /_next/static/, the screenshots and /media/ set `access_log off`,
    # because a hundred requests for the same woff2 answer no question anybody has
    # and they would bury the page hits. /download and /v1/release.json each write
    # their own log and do not write here, because nginx replaces the inherited
    # access_log rather than adding to it, and both already have a reader that
    # knows their format.
    #
    # Create the directory before the first reload or nginx will not start. It
    # already exists wherever download.log does:
    #
    #   sudo mkdir -p /var/log/nginx/nightbell
    #
    # Rotation is deploy/logrotate/nightbell-site, and it has to be installed with
    # this, or the distro's fourteen-day policy will not pick the file up and it
    # will grow without limit.
    access_log /var/log/nginx/nightbell/site.log nightbell_site;

    # -- TLS ----------------------------------------------------------------
    #
    # Let's Encrypt, matching the thirteen other certificates on this box and the
    # certbot timer that already renews them. Nightbell becomes the fourteenth
    # entry in a mechanism that exists and is proven here rather than a second,
    # parallel one.
    #
    # A Cloudflare Origin CA certificate was the original plan and is the wrong
    # call on this box: it is trusted by Cloudflare and nothing else, so the site
    # would break the moment the orange cloud was turned off, and it would mean two
    # unrelated certificate systems on one origin.
    #
    # `options-ssl-nginx.conf` is certbot's own file and is already on the box. It
    # sets the protocol list, the cipher suite, the session cache and tickets. Using
    # it rather than restating those here means this site cannot drift from the
    # other fourteen when certbot updates its recommendations.
    ssl_certificate     /etc/letsencrypt/live/nightbell.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nightbell.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # OCSP stapling is deliberately absent. No public client ever sees this
    # certificate: Cloudflare terminates TLS for every visitor and validates the
    # origin chain itself. Stapling would spend a resolver round trip per renewal
    # cycle to hand a staple to one client that does not need it.

    # -- Optional: refuse anything that is not Cloudflare --------------------
    #
    # The hardening worth doing on a proxied origin. Cloudflare presents a client
    # certificate on every origin request, so verifying it means a request reaching
    # this port from anywhere else is rejected during the handshake. Without it,
    # anyone who learns this address can bypass the edge, and every Cloudflare rate
    # limit, WAF rule and bot rule becomes optional from an attacker's side.
    #
    #   curl -fsSL https://developers.cloudflare.com/ssl/static/authenticated_origin_pull_ca.pem \
    #     -o /etc/ssl/cloudflare/origin-pull-ca.pem
    #
    # Then enable Authenticated Origin Pulls for the zone and uncomment these. Note
    # this is per-server here, so it does not affect the other fourteen sites.
    #
    # ssl_client_certificate /etc/ssl/cloudflare/origin-pull-ca.pem;
    # ssl_verify_client on;

    # -- Real client addresses ----------------------------------------------
    include snippets/nightbell/cloudflare-real-ip.conf;

    # -- Static file serving ------------------------------------------------
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Small numbers on purpose. The whole site is about forty files, and
    # inactive=20s means a release swap is picked up within twenty seconds rather
    # than being pinned behind cached metadata.
    open_file_cache max=256 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # -- Compression ---------------------------------------------------------
    #
    # gzip_static serves the .gz that scripts/precompress.mjs wrote at build time,
    # which is level 9 rather than the level worth paying for per request. The
    # module is compiled into the packaged nginx here, so it needs nothing
    # installed.
    #
    # Worth being accurate about the size of this win: behind the orange cloud,
    # Cloudflare decompresses and recompresses for the visitor, so a browser
    # receives Cloudflare's Brotli either way. What this buys is origin CPU and a
    # smaller origin-to-edge hop, not the number a browser sees.
    gzip_static on;

    # brotli_static needs a module that Ubuntu 22.04 does not package at all
    # (Debian 13 and Ubuntu 24.04 have libnginx-mod-http-brotli-static). An unknown
    # directive is fatal to nginx startup, which on this box means fifteen sites, so
    # it stays commented until the module is actually present.
    #
    # brotli_static on;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               application/manifest+json application/xml image/svg+xml text/vtt;

    # -- Headers -------------------------------------------------------------
    #
    # Read the note in the snippet before adding an add_header anywhere below.
    # nginx drops every inherited add_header from any block that declares one of
    # its own, silently, and the page still works.
    include snippets/nightbell/security-headers.conf;

    # -- Errors --------------------------------------------------------------
    error_page 404 /404.html;

    location = /404.html {
        internal;
        include snippets/nightbell/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # -- Caching -------------------------------------------------------------
    #
    # Three tiers, and which tier a file is in depends only on whether its name
    # changes when its contents do.

    # Content-hashed by Next: the name is a function of the bytes, so a changed
    # file is a different URL and this can never be stale. The self-hosted
    # Archivo and JetBrains Mono files live in here too, under media/.
    location ^~ /_next/static/ {
        include snippets/nightbell/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;

        # Stock mime.types has no .woff2, and woff2 is the only extension in here
        # it does not know, so this fallback can only ever name the fonts.
        default_type font/woff2;
    }

    # The app screenshots and the 3D hero's textures. Stable names, so not a year
    # and not immutable: a re-shot screen keeps its filename, and a browser that
    # cached it as immutable would never ask again. A week, and the deploy purges
    # Cloudflare, so the edge never holds an old one past a release.
    location ~ ^/(hero|screens)/ {
        include snippets/nightbell/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
    }

    # The two typefaces: a year, immutable.
    #
    # Split out of the media tier below after Lighthouse flagged all four unhashed
    # files together, because the two halves are not the same risk. These are
    # pinned latin subsets of Inter and JetBrains Mono at fixed weights. Their
    # bytes are not a moving target the way a re-cut video frame is, and if a face
    # is ever replaced it is a deliberate act at which point the filename changes
    # with it. 89 kB that repeat visits should never revalidate.
    location ^~ /fonts/ {
        include snippets/nightbell/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;

        # Same bug the manifest had below: stock mime.types has no .woff2 entry,
        # so both faces went out as application/octet-stream while the preload in
        # the head declared type="font/woff2". Chrome matched the preload anyway,
        # on the URL and the `as`, so nothing was fetched twice and nothing broke.
        # It was still the server telling the client the wrong thing about a file
        # it asked for by type.
        #
        # `default_type` rather than a `types` block, for the reason spelled out
        # at the manifest: a `types` block inside a location replaces the
        # inherited map instead of extending it. This location serves woff2 and
        # nothing else, so the fallback can only ever apply to them.
        default_type font/woff2;
    }

    # Stable names, changing contents: the video, the posters cut from it, and the
    # Open Graph frame.
    #
    # Deliberately NOT a year, and Lighthouse docks a couple of points for it. These
    # filenames stay the same when a new promo is rendered, so `immutable` would
    # mean anyone who has already visited sees last month's frame for a year, from
    # their own browser cache, where no Cloudflare purge can reach them. Thirty days
    # and a revalidation is the honest reading; a 304 is about 150 bytes.
    #
    # The principled fix is to give these names that carry a content hash, at
    # which point they move to the /_next/static/ tier above and get the year
    # safely. Worth doing, and it is a change to the asset pipeline rather
    # than to a cache header.
    location ^~ /media/ {
        include snippets/nightbell/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;

        # The film's captions. Stock mime.types has no .vtt, so they went out as
        # application/octet-stream, and with nosniff set a browser refuses a
        # <track> of that type: the captions never showed. vtt is the only
        # extension in here the map does not know.
        default_type text/vtt;
    }

    # Thirty days and not a year, for the same reason /media/ is not a year: these
    # names do not change when the mark is recut, so `immutable` would pin the old
    # icon in a visitor's browser for a year and no Cloudflare purge could reach
    # it. favicon.ico is in here rather than left to fall through to the server
    # block, which would serve it with no Cache-Control at all.
    location ~* ^/(favicon\.(svg|ico)|apple-touch-icon\.png|icon-\d+\.png)$ {
        include snippets/nightbell/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
    }

    # The documents. Always revalidated, so a release is live on the next request
    # rather than whenever the last visitor's cache happens to expire. `no-cache`
    # permits storing and requires checking, which is what makes the 304 work.
    #
    # try_files rather than leaving this to `index`, and the difference is a
    # redirect loop: `index index.html` answers / with an internal redirect to
    # /index.html, which matches the `= /index.html` block below and 301s back to
    # /, forever. Naming the file serves it in this context without rewriting $uri.
    location = / {
        include snippets/nightbell/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    # Every page except the landing one, by its extension, sent to the URL the
    # markup actually claims.
    #
    # The static export writes each page as a file, so /faq is faq.html on disk
    # while the canonical, the sitemap and every link say /faq. The try_files at the
    # bottom of this file resolves the short form, which leaves the long form
    # working too, and two URLs serving identical bytes is the duplicate that the
    # `= /index.html` rule further down already exists to prevent for the home page.
    #
    # ## Why it is here and not down there with that rule
    #
    # Nginx tries exact locations first, then prefixes, then regexes in the order
    # they are written. Written below `~* \.html$` this block is unreachable: that
    # one matches /faq.html first and serves it. Location order is not a style
    # question in this file, it is whether the rule runs at all.
    #
    # /404.html and /index.html are unaffected. Both have `=` locations, and an
    # exact match wins outright rather than being ordered against a regex, so the
    # error page stays directly reachable with its own status.
    #
    # `$1` is the path without the extension, so /vs/uptimerobot.html is covered
    # without naming it.
    location ~ ^/(.+)\.html$ {
        return 301 https://nightbell.app/$1;
    }

    # Kept, and it is not dead. The redirect above answers a client asking for a
    # .html URL; this answers the internal request try_files makes when it resolves
    # /faq to faq.html, which does not re-run location matching but does still need
    # a Cache-Control and a CSP.
    location ~* \.html$ {
        include snippets/nightbell/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location ~* ^/(robots\.txt|sitemap\.xml)$ {
        include snippets/nightbell/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # The manifest is split off from the two above only to name its type. Nginx's
    # stock mime.types has no .webmanifest entry, so it was going out as
    # application/octet-stream. The framework route does set the correct header,
    # but a static build turns that route into a file on disk and the header does not
    # survive the trip, so the type has to be declared at the server that serves
    # the file.
    #
    # `default_type` and not a `types` block: a `types` block inside a location
    # replaces the inherited map rather than extending it, which would have taken
    # robots.txt and sitemap.xml down to octet-stream if they had stayed in here.
    # `default_type` applies only to extensions the map does not know, and
    # .webmanifest is the only one this location can match.
    location = /site.webmanifest {
        include snippets/nightbell/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        default_type application/manifest+json;
    }

    # -- Things that should not be reachable ---------------------------------

    # The canonical for the landing page is the bare origin, so /index.html serving
    # identical bytes at a second URL is the simplest duplicate content there is.
    location = /index.html {
        return 301 https://nightbell.app/;
    }

    # The precompressed siblings are for nginx to select, not for clients to
    # request. Fetched directly they would arrive as an undecodable body with a
    # text/html Content-Type and no Content-Encoding.
    location ~* \.(br|gz)$ {
        internal;
    }

    # Nothing in dist/ starts with a dot, so this is only ever a scanner asking for
    # .git or .env. 404 rather than 403: a 403 confirms something is there.
    location ~ /\. {
        return 404;
        access_log off;
        log_not_found off;
    }

    # -- The download, counted -----------------------------------------------
    #
    # Every "Download the APK" button on the site points here rather than at
    # GitHub, so the click lands on this box and produces one log line before the
    # 302 sends it on to the identical file on the identical host it went to
    # before. See DOWNLOAD_PATH in site.config.mjs for the argument; see the
    # log_format at the top of this file for what is and is not recorded.
    #
    # `= /download` is an exact match, so it costs one hash lookup and cannot
    # accidentally shadow anything under a prefix.
    #
    # ## no-store is not optional here, it is the whole feature
    #
    # A cached redirect is an uncounted redirect. If Cloudflare ever serves this
    # 302 from the edge, the click never reaches this box, nothing is logged, and
    # the number silently becomes "clicks by people who missed the cache", which
    # looks like a real number and is not one.
    #
    # Cloudflare does not cache a 302 to a third-party host by default, so this is
    # belt and braces rather than a fix for something observed. It is here because
    # the thing that would break it is a Cache Everything page rule added later for
    # an unrelated reason, by which point the connection between that rule and a
    # download count that quietly stopped growing is not one anybody would make.
    # `no-store` also keeps the browser from reusing it, which matters for the
    # person who downloads the same release twice.
    #
    # The security-headers include is mandatory, not tidiness: this block sets a
    # Cache-Control header of its own, and per that file's own warning, one
    # `add_header` in a location discards every inherited one. Without the include
    # this location would answer with no CSP and no HSTS.
    location = /download {
        include snippets/nightbell/security-headers.conf;
        add_header Cache-Control "no-store" always;

        # Its own file, not the shared access log, for two reasons: counting is a
        # `wc -l` instead of a grep against millions of asset requests, and it sits
        # outside /var/log/nginx/*.log, which is the glob the distro's logrotate
        # owns. That keeps the history on the monthly, five-year rotation in
        # deploy/logrotate/nightbell-download instead of being deleted after
        # fourteen days along with everything else.
        access_log /var/log/nginx/nightbell/download.log nightbell_download;

        # Generated from site.config.mjs. Holds the `return 302` and nothing else.
        include snippets/nightbell/download-target.conf;
    }

    # -- The release manifest, counted ---------------------------------------
    #
    # The file every install of the app reads to find out whether it is behind.
    # Generated by website/scripts/release-files.mjs from the same RELEASE
    # block the download button comes from, shipped in out/ like any other asset,
    # so a release deploys it without a step to forget.
    #
    # `= /v1/release.json` is an exact match, one hash lookup, and cannot shadow
    # anything under a prefix. The version is in the path because an installed APK
    # reads whichever path it was compiled with forever: a future payload shape
    # ships at /v2/ while this keeps answering the copies that only speak v1.
    #
    # ## no-store is the whole feature here too
    #
    # A cached manifest is an uncounted manifest, exactly as with /download, and
    # the failure looks identical: the number stops growing while continuing to
    # look like a number. Cloudflare does not cache .json by default and no-store
    # tells it not to regardless, so this is belt and braces against the thing
    # that would actually break it, which is a Cache Everything rule added later
    # for an unrelated reason by somebody who will not connect the two.
    #
    # There is a way out if this ever gets heavy enough to matter: let the edge
    # cache it and read the count from Cloudflare's own analytics, which is a
    # party that already terminates the TLS and already has the address. At four
    # requests per install per day it is not close to mattering.
    #
    # The security-headers include is mandatory for the same reason it is on
    # /download: this block sets a Cache-Control of its own, and one `add_header`
    # in a location discards every inherited one.
    #
    # The log directory is the one download.log already uses, so there is nothing
    # new to create before a reload.
    location = /v1/release.json {
        include snippets/nightbell/security-headers.conf;
        add_header Cache-Control "no-store" always;

        access_log /var/log/nginx/nightbell/census.log nightbell_census;

        try_files $uri =404;
    }

    # -- Everything else -----------------------------------------------------
    #
    # `$uri.html` is in here now and it was not before, and the comment it replaces
    # said an extensionless request was a mistake because there were two documents
    # and the only extensionless path that resolved was /.
    #
    # That stopped being true the moment /faq, /docs, /android-background-limits and
    # the two comparison pages existed. The static export writes them as files,
    # so those are faq.html and vs/uptimerobot.html on disk
    # while every canonical, the sitemap and every link in the markup say the
    # extensionless form. Without the fallback the whole site would work in dev and
    # in a local preview server, and every page except the landing page would 404 in
    # production, which is the exact shape of failure this file's other comments
    # keep describing: invisible in a browser, visible only to whoever clicks the
    # link after the deploy.
    #
    # `$uri.html` sits after `$uri` so a real file always wins, and the
    # `.html` requests it makes reachable are sent back to the extensionless form
    # by the redirect above.
    # The headers are on here because this is the location that serves a page.
    #
    # try_files resolving /faq to faq.html is an internal file lookup, not an
    # internal redirect, so the response is built in this context and not in the
    # `~* \.html$` one. Without these two lines every page except the landing page
    # would go out with no Content-Security-Policy, no HSTS and no Cache-Control,
    # while looking completely normal in a browser.
    #
    # `add_header` in a location discards every inherited one, which is why the
    # include is mandatory rather than tidy. That is the same trap documented at
    # /download and at the release manifest.
    location / {
        include snippets/nightbell/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri.html $uri/ =404;
    }
}

# ---------------------------------------------------------------------------
# The fallback, and why it is not fixed here
#
# This box has no `default_server`, so a request whose Host matches no server_name
# is served by whichever block nginx loaded first. sites-enabled is read in
# alphabetical order, which makes that anketa.conf, and that is why nightbell.app
# served a coffee survey before this file existed.
#
# The clean fix is one default_server that answers 444 and nothing else. It is not
# in this file because it would change behaviour for every other domain aimed at
# this address, some of which may be relying on the current fallback. It belongs in
# its own file, decided for the box as a whole:
#
#   server {
#       listen 80 default_server;
#       listen [::]:80 default_server;
#       server_name _;
#       return 444;
#   }
#
# A default_server on 443 additionally needs a certificate to complete a handshake
# before it can answer, and on nginx 1.18 there is no `ssl_reject_handshake` to
# avoid that, so the 443 half needs a throwaway self-signed pair. Worth doing, and
# worth doing deliberately rather than as a side effect of adding a landing page.
